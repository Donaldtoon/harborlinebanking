services:
  - type: web
    name: harborline-banking-
    runtime: node
    plan: starter
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: harborline--db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
  - type: psql
    name: harborline--db
    plan: basic-256mb
    databaseName: harborline_
    user: harborline_app
